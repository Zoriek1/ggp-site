  pt: Estudo de caso que examina relações entre capital cultural, social e
    econômico e o desempenho acadêmico em 2018. Narrativas coletadas em
    entrevistas não-agendadas mostram como as trajetórias de vida dos estudantes
    influenciam diretamente suas práticas escolares.
